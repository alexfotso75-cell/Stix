<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1628"/>
      <stop offset="100%" stop-color="#050912"/>
    </linearGradient>
    <linearGradient id="gGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <filter id="gShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#8B5CF6" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Full bleed background (maskable) -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>
  <!-- Subtle border -->
  <rect width="512" height="512" fill="none" stroke="#8B5CF6" stroke-width="2" opacity="0.10"/>
  <!-- Glow -->
  <circle cx="256" cy="240" r="200" fill="url(#glow)"/>

  <!-- Bold "G" — within safe zone -->
  <text x="256" y="316"
        font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
        font-size="300"
        font-weight="900"
        text-anchor="middle"
        fill="url(#gGrad)"
        filter="url(#gShadow)"
        letter-spacing="-6">G</text>

  <!-- Cross -->
  <rect x="247" y="388" width="18" height="52" rx="5" ry="5" fill="#8B5CF6" opacity="0.45"/>
  <rect x="225" y="405" width="62" height="18" rx="5" ry="5" fill="#8B5CF6" opacity="0.45"/>
</svg>
