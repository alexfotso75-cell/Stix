name: Deploy GraceLink to Firebase

on:
  push:
    branches:
      - main
      - claude/gracelink-app-build-On9BN

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Write service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/sa.json

      - name: Deploy Hosting + Firestore Rules
        run: firebase deploy --only hosting,firestore:rules --project gracelink-8cc78
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
